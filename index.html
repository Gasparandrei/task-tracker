<style>
/* Layout: full-width primary header with a half-ellipse dip (name, time, date), then one centred column:
   secondary-colour Tasks tab, task bubbles, yellow add row, mascot slot. Fixed bottom bar: Tasks, Progress, Settings. */
:root {
  --bg: #F3F5F4;
  --surface: #FFFFFF;
  --surface-2: #E9EEEC;
  --fg: #14211D;
  --muted: #5B6B65;
  --line: #DCE3E0;
  --line-strong: #A9B6B1;
  --primary: #0A8580;
  --on-primary: #FFFFFF;
  --secondary: #D9383F;
  --on-secondary: #FFFFFF;
  --done: #2E9F4F;
  --on-done: #FFFFFF;
  --done-deep: color-mix(in srgb, var(--done) 90%, #000);
  --tick-off: #D3D8D5;
  --flame: #E8590C;
  --coin: #F5B800;
  --on-coin: #3D2B00;
  --danger: #B3261E;
  --ice: #2B8AE0;
  --warn-bg: color-mix(in srgb, #F5B800 22%, var(--surface));
  --warn-line: #D9A300;
  --urgent-bg: color-mix(in srgb, var(--danger) 13%, var(--surface));
  --urgent-line: var(--danger);
  --shadow: 0 1px 2px rgba(20, 33, 29, .06), 0 6px 16px rgba(20, 33, 29, .06);
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1513; --surface: #17211E; --surface-2: #1F2C28; --fg: #E8F0EC; --muted: #97A8A1;
    --line: #2A3833; --line-strong: #5A6E66; --done: #3CCB63; --on-done: #06210F; --tick-off: #33403B;
    --flame: #FF8A4C; --danger: #FF8A80; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1513; --surface: #17211E; --surface-2: #1F2C28; --fg: #E8F0EC; --muted: #97A8A1;
  --line: #2A3833; --line-strong: #5A6E66; --done: #3CCB63; --on-done: #06210F; --tick-off: #33403B;
  --flame: #FF8A4C; --danger: #FF8A80; --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: var(--fg); }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* header */
.top { background: linear-gradient(var(--primary) 0 44px, transparent 44px); color: var(--on-primary); }
.brandrow { display: flex; align-items: center; gap: 14px; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-text h2 { font-size: 1.5rem; line-height: 1.1; }
.bulge { background: var(--primary); color: var(--on-primary); width: min(340px, 88%); margin: 0 auto; padding: 14px 24px 30px; text-align: center; border-radius: 0 0 50% 50% / 0 0 100% 100%; display: flex; flex-direction: column; align-items: center; gap: 0; }
.brand { display: flex; align-items: center; justify-content: center; gap: 8px; max-width: 100%; }
.hello { font-weight: 800; font-size: 1rem; overflow-wrap: anywhere; }
.clock { font-family: var(--font-display); font-weight: 700; font-size: 2.6rem; line-height: 1; }
.dateline { font-size: .9rem; font-weight: 600; opacity: .95; }

.shell { max-width: 560px; margin-inline: auto; padding-inline: 16px; padding-block: 18px 0; }
.view { display: flex; flex-direction: column; gap: 16px; }

/* tasks tab */
.tab-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tab { margin-left: -16px; background: var(--secondary); color: var(--on-secondary); font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; line-height: 1; padding: 14px 44px 14px 28px; border-radius: 0 999px 999px 0; letter-spacing: .02em; }
.tab-stat { font-weight: 700; color: var(--muted); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: .88rem; min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip-rm { background: transparent; border-style: dashed; color: var(--muted); }
.chip-rm:hover { color: var(--fg); border-color: var(--line-strong); }

.group { display: flex; flex-direction: column; gap: 10px; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-inline: 4px; }
.group-head h2 { font-size: 1.5rem; line-height: 1.1; letter-spacing: .02em; }
ul.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
li.task { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 12px 16px 12px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
li.task.done { border-color: var(--done); }
li.task.yellow { background: var(--warn-bg); border-color: var(--warn-line); }
li.task.red { background: var(--urgent-bg); border-color: var(--urgent-line); }
.tick { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--tick-off); display: grid; place-items: center; padding: 0; position: relative; flex: none; color: var(--on-done); }
.tick:hover { filter: brightness(.95); }
.tick.on { background: var(--done); }
.tick svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.tick:not(.on):not(.ring) svg { opacity: 0; }
.tick:not(.on):not(.ring):hover svg { opacity: .55; color: var(--muted); }
.tick.ring { background: conic-gradient(var(--done) var(--p, 0%), var(--tick-off) 0); }
.tick.ring span { position: absolute; inset: 5px; border-radius: 50%; background: var(--surface); color: var(--fg); display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
@media (prefers-reduced-motion: no-preference) { .tick { transition: background-color .15s, transform .12s; } .tick:active { transform: scale(.92); } }
/* check-off: the button pops, the tick draws in, a ring fades out. A quota check-in gets a small bump.
   These play even with reduced motion on (the owner asked for that); they are short and stay inside the row. */
.tick::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--done-deep); opacity: 0; pointer-events: none; }
.tick.pop { animation: tick-pop .45s cubic-bezier(.3, 1.6, .5, 1); }
.tick.pop svg path { stroke-dasharray: 1; animation: tick-draw .28s .1s ease-out both; }
.tick.pop::after { animation: tick-ring .55s .05s ease-out; }
.tick.bump { animation: tick-bump .3s ease-out; }
@keyframes tick-pop { 0% { transform: scale(.94); background-color: var(--tick-off); } 55% { transform: scale(1.03); background-color: var(--done-deep); } 100% { transform: scale(1); } }
@keyframes tick-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes tick-ring { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7); } }
@keyframes tick-bump { 50% { transform: scale(1.025); } }
/* when a check-in raises the streak, its flame flares up once and glows */
.streak.flare svg { transform-origin: 50% 90%; animation: flame-flare 1.1s ease-out; }
@keyframes flame-flare {
  0% { transform: scale(1) rotate(0); filter: none; }
  30% { transform: scale(1.3, 1.4) rotate(-5deg); filter: saturate(1.6) brightness(1.2) drop-shadow(0 0 6px var(--flame)); }
  55% { transform: scale(.95, 1.12) rotate(3deg); filter: saturate(1.4) brightness(1.1) drop-shadow(0 0 4px var(--flame)); }
  80% { transform: scale(1.05, .97) rotate(-1deg); }
  100% { transform: scale(1) rotate(0); filter: none; }
}
/* a freeze kicks in: the flame shivers, turns to ice and frost sparkles around it.
   Checking in on a frozen streak: the ice cracks, shatters into shards and the flame flares back up. */
.streak b { position: relative; }
.streak .fx { position: absolute; left: 0; top: 50%; width: 22px; height: 22px; margin-top: -11px; pointer-events: none; }
.streak.freezing svg { transform-origin: 50% 90%; animation: flame-freeze 1.4s ease-in-out; }
.streak.freezing b { animation: num-freeze 1.4s ease-in-out; }
.streak .fx i { position: absolute; left: 7px; top: 7px; width: 8px; height: 8px; background: var(--ice); opacity: 0; }
.streak.freezing .fx i { clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); animation: frost-spark .7s var(--d) ease-out; }
.streak.thaw svg { transform-origin: 50% 90%; animation: flame-thaw 1.6s ease-out; }
.streak.thaw .fx i { clip-path: polygon(50% 0, 100% 55%, 35% 100%, 0 40%); animation: ice-shard .75s .62s cubic-bezier(.2, .7, .3, 1); }
.streak.freezing .fx i:nth-child(1) { --x: -10px; --y: -9px; --d: .35s; }
.streak.freezing .fx i:nth-child(2) { --x: 10px; --y: -11px; --d: .5s; }
.streak.freezing .fx i:nth-child(3) { --x: 11px; --y: 7px; --d: .65s; }
.streak.freezing .fx i:nth-child(4) { --x: -11px; --y: 6px; --d: .8s; }
.streak.thaw .fx i:nth-child(1) { --x: -18px; --y: -14px; --r: -140deg; }
.streak.thaw .fx i:nth-child(2) { --x: 17px; --y: -16px; --r: 150deg; }
.streak.thaw .fx i:nth-child(3) { --x: -20px; --y: 4px; --r: -90deg; }
.streak.thaw .fx i:nth-child(4) { --x: 19px; --y: 6px; --r: 110deg; }
.streak.thaw .fx i:nth-child(5) { --x: -8px; --y: 16px; --r: -60deg; }
.streak.thaw .fx i:nth-child(6) { --x: 9px; --y: 17px; --r: 70deg; }
.streak .fx .crack { position: absolute; inset: 0; width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.streak.thaw .fx .crack { stroke-dasharray: 1; animation: ice-crack .65s ease-out; }
@keyframes flame-freeze {
  0% { fill: var(--flame); transform: none; filter: none; }
  12% { transform: rotate(-5deg); }
  22% { transform: rotate(5deg); }
  32% { transform: rotate(-4deg); }
  42% { fill: var(--flame); transform: rotate(3deg); }
  60% { fill: var(--ice); transform: scale(.85); }
  78% { transform: scale(1.1); filter: brightness(1.15) drop-shadow(0 0 5px var(--ice)); }
  100% { fill: var(--ice); transform: none; filter: none; }
}
@keyframes num-freeze { 0%, 42% { color: var(--fg); } 70%, 100% { color: var(--ice); } }
@keyframes frost-spark {
  0% { opacity: 0; transform: translate(var(--x), var(--y)) scale(0) rotate(0); }
  45% { opacity: 1; transform: translate(var(--x), var(--y)) scale(1.1) rotate(45deg); }
  100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(0) rotate(90deg); }
}
@keyframes flame-thaw {
  0% { fill: var(--ice); transform: none; filter: none; }
  8% { transform: rotate(-3deg); }
  16% { transform: rotate(3deg); }
  24% { transform: rotate(-3deg); }
  32% { transform: rotate(2deg); }
  38% { fill: var(--ice); transform: scale(.9); }
  52% { fill: var(--flame); transform: scale(1.3, 1.4) rotate(-5deg); filter: saturate(1.6) brightness(1.2) drop-shadow(0 0 6px var(--flame)); }
  70% { transform: scale(.95, 1.12) rotate(3deg); filter: saturate(1.4) brightness(1.1) drop-shadow(0 0 4px var(--flame)); }
  85% { transform: scale(1.05, .97) rotate(-1deg); }
  100% { transform: none; filter: none; }
}
@keyframes ice-crack { 0% { opacity: 1; stroke-dashoffset: 1; } 80% { opacity: 1; stroke-dashoffset: 0; } 100% { opacity: 0; stroke-dashoffset: 0; } }
@keyframes ice-shard {
  0% { opacity: 1; transform: none; }
  100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(.5); }
}
.t-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.t-title { background: none; border: 0; padding: 0; text-align: left; font-weight: 800; font-size: 1rem; line-height: 1.25; overflow-wrap: anywhere; }
.t-title:hover { text-decoration: underline; }
li.task.done .t-title { color: var(--muted); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: .78rem; font-weight: 700; }
.tag { border-radius: 999px; padding: 2px 10px; background: var(--surface-2); color: var(--muted); }
.tag.cat { background: transparent; border: 1px solid var(--line-strong); }
.tag.due { background: transparent; padding-left: 0; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.tag.due.late { color: var(--danger); }
.tag.due svg { width: 14px; height: 14px; fill: var(--flame); stroke: none; }
.progress-txt { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.undo { background: none; border: 1px solid var(--line-strong); border-radius: 999px; font-size: .75rem; font-weight: 700; padding: 1px 10px; color: var(--muted); }
.streak { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.05; min-width: 58px; }
.streak b { display: flex; align-items: center; gap: 3px; font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; }
.streak svg { width: 22px; height: 22px; fill: var(--flame); stroke: none; }
.streak.zero svg { fill: var(--tick-off); }
.streak.zero b { color: var(--muted); }
.streak small { color: var(--muted); font-size: .72rem; font-weight: 700; }
.streak.frozen svg { fill: var(--ice); }
.streak.frozen b { color: var(--ice); }
.tag.ice { font-size: .78rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; background: color-mix(in srgb, var(--ice) 16%, var(--surface)); color: var(--fg); }
svg.snow { width: 14px; height: 14px; fill: none; stroke: var(--ice); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.btn.small { min-height: 44px; padding: 8px 16px; white-space: nowrap; }
.fz-left { display: flex; flex-direction: column; min-width: 0; gap: 2px; }
.st-list li.fz { align-items: center; }
.head-r { display: flex; align-items: center; gap: 10px; }
.tags .del { margin: -6px 0 -6px auto; width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; padding: 0; }
.tags .del:hover { color: var(--danger); background: var(--surface-2); }
.tags .del svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.note-chip { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 32px; border: 1px dashed var(--line-strong); border-radius: 999px; background: transparent; color: var(--muted); font-size: .82rem; font-weight: 700; padding: 4px 12px 4px 10px; text-align: left; }
.note-chip.has { border-style: solid; border-color: var(--line); background: var(--surface-2); color: var(--fg); font-weight: 600; }
.note-chip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note-chip svg { width: 15px; height: 15px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.note-chip:hover { color: var(--fg); border-color: var(--fg); }
.note-edit { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.note-edit label { display: flex; flex-direction: column; gap: 3px; font-size: .78rem; font-weight: 700; color: var(--muted); min-width: 0; }
.note-edit .ne-amt { flex: 0 1 110px; }
.note-edit .ne-txt { flex: 1 1 180px; }
.note-edit input { width: 100%; min-height: 40px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); color: var(--fg); padding: 6px 10px; font: inherit; font-size: .9rem; }
.note-edit .ne-row { display: flex; gap: 6px; flex-wrap: wrap; flex-basis: 100%; }
.note-edit .btn { min-height: 36px; padding: 4px 12px; font-size: .85rem; min-width: 0; }
.f-hint { font-size: .8rem; margin: 0; }
.day-list li { flex-wrap: wrap; }
.day-list .dl-note { flex-basis: 100%; margin-top: -4px; color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.recent-notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: .88rem; }
.recent-notes li { display: flex; gap: 10px; }
.recent-notes .num { color: var(--muted); flex-shrink: 0; min-width: 88px; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; font-weight: 700; margin-top: 4px; }
.confirm .btn { min-height: 40px; }

.add-row { display: flex; align-items: center; gap: 14px; background: transparent; border: 2px dashed var(--line-strong); border-radius: 24px; padding: 12px 16px 12px 12px; font-weight: 800; text-align: left; width: 100%; }
.add-row:hover { border-color: var(--coin); }
.plus { width: 44px; height: 44px; border-radius: 50%; background: var(--coin); color: var(--on-coin); display: grid; place-items: center; flex: none; }
.plus svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; }

.mascot { display: flex; align-items: flex-end; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.bubble { background: var(--surface); border: 1px solid var(--line); border-radius: 18px 18px 4px 18px; padding: 10px 14px; font-weight: 700; max-width: 220px; box-shadow: var(--shadow); }
.mascot svg { width: 104px; height: 104px; flex: none; }

.empty { background: var(--surface); border: 1px dashed var(--line-strong); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.empty p { margin: 0; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.banner { background: var(--surface-2); border-radius: 12px; padding: 10px 14px; font-size: .88rem; font-weight: 600; }

/* progress */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) {
  .af .af-t { display: none; }
  .progress-txt .pt-t { display: none; } /* the ring or the check already shows it */
  .tags .tag-type { display: none; } /* the section heading already says Daily, Weekly or One time */
  .af { padding: 2px 9px; }
}
.tag.goal-met { background: color-mix(in srgb, var(--primary) 20%, var(--surface)); color: var(--fg); }
.fz-how summary { cursor: pointer; color: var(--primary); font-weight: 700; font-size: .88rem; width: max-content; }
.fz-how[open] summary { margin-bottom: 6px; }
.fz-how p { margin: 0 0 6px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile-val { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1; }
.bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--coin); border-radius: 999px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-head h2 { font-size: 1.3rem; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.icon-btn:disabled { opacity: .35; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { text-align: center; font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.cell { aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: .85rem; padding: 0; min-width: 0; }
.cell.l1 { background: color-mix(in srgb, var(--primary) 28%, var(--surface)); border-color: transparent; }
.cell.l2 { background: color-mix(in srgb, var(--primary) 55%, var(--surface)); border-color: transparent; }
.cell.l3 { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.cell.today { outline: 2px solid var(--fg); outline-offset: 1px; }
.cell.sel { box-shadow: 0 0 0 3px var(--secondary); }
.cell:disabled { opacity: .35; cursor: default; }
.day-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.day-list li, .st-list li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); }
.day-list, .st-list { list-style: none; margin: 0; padding: 0; }
.st-list li:first-child, .day-list li:first-child { border-top: 0; }
.st-list b { font-family: var(--font-display); font-size: 1.15rem; }

/* settings */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > legend, .field > .flabel { font-size: .85rem; font-weight: 700; color: var(--muted); padding: 0; }
fieldset.field { border: 0; margin: 0; padding: 0; }
input[type="text"], input[type="date"], input[type="time"], input[type="number"] { background: var(--bg); border: 1px solid var(--line-strong); border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; min-height: 44px; }
textarea { background: var(--bg); border: 1px solid var(--line-strong); border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; resize: vertical; font: inherit; color: var(--fg); }
.t-desc { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.sw { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--line-strong); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--fg); }
dialog.alertbox { border: 4px solid var(--secondary); border-radius: 24px; padding: 24px; width: min(420px, 92vw); background: var(--surface); color: var(--fg); box-shadow: 0 20px 60px rgba(0, 0, 0, .45); }
dialog.alertbox::backdrop { background: rgba(8, 14, 12, .7); }
dialog.alertbox h2 { font-size: 2rem; margin-bottom: 10px; }
dialog.alertbox ul { margin: 0 0 18px; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 1.05rem; font-weight: 700; }
dialog.alertbox .btn { width: 100%; font-size: 1.1rem; }
.card.heads { border-color: var(--warn-line); background: var(--warn-bg); }
.card.heads .st-list li { justify-content: flex-start; border-top-color: var(--warn-line); }
.mp { width: 60px; height: 60px; border-radius: 16px; border: 2px solid var(--line); background: var(--bg); padding: 4px; display: grid; place-items: center; }
.mp svg { width: 48px; height: 48px; }
.linkish { align-self: flex-start; background: none; border: 0; padding: 4px 0; color: var(--primary); font-weight: 700; font-size: .88rem; text-decoration: underline; text-underline-offset: 3px; }
.shop { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.sm { border: 1px solid var(--line); border-radius: 18px; background: var(--bg); padding: 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.sm b { font-size: .9rem; line-height: 1.2; }
.sm-art { width: 76px; height: 76px; display: grid; place-items: center; }
.sm-art svg { width: 76px; height: 76px; }
.sm .btn { width: 100%; }
.sm .bar { width: 100%; }
.sm .muted { font-size: .78rem; }
.sm-req { font-size: .82rem; font-weight: 700; }
.sm.own { border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); }
.sm.secret .sm-art svg { filter: brightness(0) opacity(.28); }
:root[data-theme="dark"] .sm.secret .sm-art svg { filter: brightness(0) invert(1) opacity(.22); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sm.secret .sm-art svg { filter: brightness(0) invert(1) opacity(.22); } }
.sm.gold { background: linear-gradient(160deg, color-mix(in srgb, #F5C842 16%, var(--bg)), var(--bg) 60%); border-color: color-mix(in srgb, #D4A017 45%, var(--line)); }
.mp[aria-pressed="true"] { border-color: var(--fg); background: var(--surface-2); }
input[type="color"] { width: 44px; height: 44px; padding: 0; border: 0; background: none; border-radius: 50%; }
.switch { display: flex; align-items: center; gap: 12px; font-weight: 700; min-height: 44px; }
.switch input { width: 22px; height: 22px; accent-color: var(--primary); }
.btn { background: var(--primary); color: var(--on-primary); border: 0; border-radius: 14px; padding: 12px 22px; font-weight: 800; min-height: 46px; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line-strong); }
.btn.danger { background: var(--danger); color: var(--bg); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.err { color: var(--danger); font-weight: 700; font-size: .85rem; min-height: 1.2em; margin: 0; }

/* bottom bar */
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
.nav-in { max-width: 560px; margin-inline: auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.nav button { background: none; border: 0; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 800; font-size: .75rem; color: var(--muted); min-height: 60px; }
.nav button[aria-current="page"] { color: var(--primary); }
.nav button[aria-current="page"] .ind { background: var(--primary); }
.nav .ind { width: 28px; height: 4px; border-radius: 999px; background: transparent; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nav button[aria-current="page"] { color: var(--fg); } }
:root[data-theme="dark"] .nav button[aria-current="page"] { color: var(--fg); }

/* sheet */
dialog.sheet { border: 0; padding: 0; background: var(--surface); color: var(--fg); width: min(560px, 100%); max-width: 100%; border-radius: 26px 26px 0 0; max-height: 92dvh; overflow: auto; }
dialog.sheet[open] { position: fixed; inset: auto 0 0 0; margin: 0 auto; }
dialog.sheet::backdrop { background: rgba(8, 14, 12, .55); }
.sheet form { padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 11px 8px; min-height: 44px; font-weight: 800; color: var(--muted); background: var(--bg); cursor: pointer; }
.seg input:checked + label { background: var(--primary); color: var(--on-primary); }
.seg input:focus-visible + label { outline: 3px solid var(--secondary); outline-offset: -3px; }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 800; font-size: .9rem; max-width: calc(100vw - 32px); text-align: center; opacity: 0; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }
.toast.act.show { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 6px 6px 6px 18px; }
.toast .t-undo { border: 0; border-radius: 999px; background: var(--bg); color: var(--fg); font-weight: 800; font-size: .85rem; padding: 6px 14px; min-height: 32px; flex-shrink: 0; }
.toast .t-undo:hover { background: var(--surface-2); }
@media (prefers-reduced-motion: no-preference) { .toast { transition: opacity .2s; } }
[hidden] { display: none !important; }

.af { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line-strong); background: transparent; color: var(--muted); border-radius: 999px; padding: 2px 10px; font-size: .75rem; font-weight: 700; min-height: 32px; margin-left: auto; }
.af[aria-pressed="true"] { background: color-mix(in srgb, var(--ice) 16%, var(--surface)); color: var(--fg); border-color: var(--ice); }
.af.dim { opacity: .55; }
.vac-list li { flex-wrap: wrap; align-items: center; }
.vac-list .confirm { flex-basis: 100%; }
.tags .af + .del { margin-left: 0; }

/* schedule */
select { background: var(--bg); border: 1px solid var(--line-strong); border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; min-height: 44px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.wk-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wk-head h2 { font-size: 1.3rem; text-align: center; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px 0 6px; min-height: 66px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 800; min-width: 0; }
.wd small { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.wd b { font-family: var(--font-display); font-size: 1.4rem; line-height: 1.1; font-weight: 700; }
.wd .dots { display: flex; gap: 3px; height: 6px; }
.wd .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
.wd.today { outline: 2px solid var(--fg); outline-offset: 1px; }
.wd[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.wd[aria-pressed="true"] small { color: inherit; opacity: .85; }
.wd[aria-pressed="true"] .dots i { background: var(--on-primary); }
.card.nextup { border-color: var(--primary); border-width: 2px; }
.card.nextup p { margin: 0; font-weight: 800; font-size: 1.05rem; }
li.ev { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 12px 16px 12px 16px; display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 14px; align-items: center; }
li.ev.now { border-color: var(--primary); border-width: 2px; }
li.ev.past .t-title, li.ev.skipped .t-title { color: var(--muted); }
li.ev.skipped .t-title { text-decoration: line-through; }
.ev-time { display: flex; flex-direction: column; line-height: 1.05; gap: 2px; }
.ev-time b { font-family: var(--font-display); font-weight: 700; font-size: 1.55rem; }
.ev-time span { color: var(--muted); font-weight: 700; font-size: .85rem; }
.tag.now { background: var(--primary); color: var(--on-primary); }
.tag.warn { background: var(--warn-bg); color: var(--fg); border: 1px solid var(--warn-line); }
.daychips { display: flex; gap: 6px; flex-wrap: wrap; }
.daychips .chip { min-width: 48px; text-align: center; padding-inline: 10px; }

/* installed app (PC window or phone home screen): no pull-to-refresh bounce, no grey tap flash */
@media (display-mode: standalone) {
  html, body { overscroll-behavior-y: none; }
  button, label, a { -webkit-tap-highlight-color: transparent; }
}

/* borderless window bar (desktop app) */
.wbar { position: fixed; top: 0; left: 0; right: 0; height: 32px; z-index: 40; display: flex; align-items: stretch; background: var(--primary); color: var(--on-primary); -webkit-app-region: drag; user-select: none; }
.wbar-t { flex: 1; display: flex; align-items: center; padding-left: 12px; font-weight: 800; font-size: .85rem; letter-spacing: .02em; }
.wbar button { -webkit-app-region: no-drag; width: 46px; border: 0; background: transparent; color: inherit; display: grid; place-items: center; padding: 0; }
.wbar button:hover { background: rgba(255, 255, 255, .18); }
.wbar button.x:hover { background: #E81123; color: #fff; }
.wbar svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
html.bl body { padding-top: 32px; }
/* see-through window (desktop app): only the page background lets the desktop show through */
html.glass body { background: color-mix(in srgb, var(--bg) var(--glass-a, 65%), transparent); min-height: 100vh; }
html.glass::after { content: ""; position: fixed; inset: 0; border: 1px solid var(--line-strong); pointer-events: none; z-index: 60; }
.rz { position: fixed; z-index: 61; }
.rz-r { top: 32px; right: 0; bottom: 14px; width: 6px; cursor: ew-resize; }
.rz-b { left: 0; right: 14px; bottom: 0; height: 6px; cursor: ns-resize; }
.rz-rb { right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; }
.range { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
.range input { width: 100%; accent-color: var(--primary); }
html.bl::after { content: ""; position: fixed; inset: 0; border: 1px solid var(--line-strong); pointer-events: none; z-index: 60; }
</style>

<div class="wbar" id="wbar" hidden>
  <div class="wbar-t">Task Tracker</div>
  <button type="button" id="wbMin" aria-label="Minimize"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h10"/></svg></button>
  <button type="button" id="wbMax" aria-label="Maximize or restore"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="2.5" width="9" height="9" rx="1"/></svg></button>
  <button type="button" id="wbClose" class="x" aria-label="Close"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>
</div>
</head>
<body>
<header class="top">
  <div class="bulge">
    <div class="brand"><div class="hello" id="hello"></div></div>
    <div class="clock num" id="clock"></div>
    <div class="dateline" id="dateLine"></div>
  </div>
</header>

<main class="shell" id="view"></main>

<nav class="nav" aria-label="Main">
  <div class="nav-in" id="nav"></div>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <form id="taskForm" novalidate>
    <h2 id="sheetTitle">New task</h2>
    <div class="field">
      <label for="fTitle">Task name</label>
      <input type="text" id="fTitle" maxlength="80" autocomplete="off">
    </div>
    <fieldset class="field">
      <legend>Repeats</legend>
      <div class="seg">
        <input type="radio" name="ftype" id="tDaily" value="daily" checked><label for="tDaily">Daily</label>
        <input type="radio" name="ftype" id="tWeekly" value="weekly"><label for="tWeekly">Weekly</label>
        <input type="radio" name="ftype" id="tOnce" value="once"><label for="tOnce">One time</label>
      </div>
    </fieldset>
    <div class="field" id="targetWrap">
      <label for="fTarget" id="targetLabel">Times per day</label>
      <input type="number" id="fTarget" min="1" max="99" value="1" inputmode="numeric">
    </div>
    <div class="field" id="dueWrap" hidden>
      <label for="fDue">Due date</label>
      <input type="date" id="fDue">
      <label for="fDueTime" style="margin-top:8px">Due time (optional)</label>
      <input type="time" id="fDueTime">
    </div>
    <div class="field" id="unitWrap">
      <label for="fUnit">Track an amount (optional)</label>
      <input type="text" id="fUnit" maxlength="16" autocomplete="off" placeholder="min, g protein, pages">
      <p class="muted f-hint">Name a unit to log how much with each check-in.</p>
      <label for="fGoal" id="goalLabel">Daily goal (optional)</label>
      <input type="number" id="fGoal" min="0" step="any" inputmode="decimal" placeholder="150">
    </div>
    <div class="field">
      <label for="fCat">Category (optional)</label>
      <input type="text" id="fCat" maxlength="24" list="catList" autocomplete="off">
      <datalist id="catList"></datalist>
    </div>
    <div class="field">
      <label for="fDesc">Description (optional)</label>
      <textarea id="fDesc" maxlength="300" rows="3"></textarea>
    </div>
    <div class="field" id="notesWrap" hidden>
      <span class="flabel">Recent check-in notes</span>
      <ul class="recent-notes" id="fNotes"></ul>
    </div>
    <p class="err" id="formErr" role="alert"></p>
    <div class="row">
      <button class="btn" type="submit" id="saveBtn">Add task</button>
      <button class="btn ghost" type="button" id="cancelBtn">Cancel</button>
    </div>
    <div class="row" id="deleteRow" hidden>
      <button class="btn ghost" type="button" id="deleteBtn">Delete task</button>
      <span id="deleteAsk" hidden class="row">
        <span class="muted" id="deleteMsg"></span>
        <button class="btn danger" type="button" id="deleteYes">Yes, delete</button>
        <button class="btn ghost" type="button" id="deleteNo">Keep it</button>
      </span>
    </div>
  </form>
</dialog>

<dialog class="sheet" id="evSheet" aria-labelledby="evTitle">
  <form id="evForm" novalidate>
    <h2 id="evTitle">New event</h2>
    <div class="field">
      <label for="eName">Event name</label>
      <input type="text" id="eName" maxlength="80" autocomplete="off">
    </div>
    <fieldset class="field">
      <legend>Repeats</legend>
      <div class="seg two">
        <input type="radio" name="ekind" id="kWeekly" value="weekly" checked><label for="kWeekly">Every week</label>
        <input type="radio" name="ekind" id="kOnce" value="once"><label for="kOnce">One time</label>
      </div>
    </fieldset>
    <fieldset class="field" id="eDaysWrap">
      <legend>On these days</legend>
      <div class="daychips" id="eDays" role="group" aria-label="Days of the week"></div>
    </fieldset>
    <div class="field" id="eRepWrap">
      <div class="two-col">
        <div class="field"><label for="eBegin">Starts on</label><input type="date" id="eBegin"></div>
        <div class="field"><label for="eWeeks">Number of weeks</label><input type="number" id="eWeeks" min="1" max="52" inputmode="numeric"></div>
      </div>
      <p class="muted" id="eRepHint" style="margin:0"></p>
    </div>
    <div class="field" id="eDateWrap" hidden>
      <label for="eDate">Date</label>
      <input type="date" id="eDate">
    </div>
    <div class="two-col">
      <div class="field"><label for="eStart">Starts</label><input type="time" id="eStart"></div>
      <div class="field"><label for="eEnd">Ends</label><input type="time" id="eEnd"></div>
    </div>
    <div class="field">
      <label for="ePlace">Place (optional)</label>
      <input type="text" id="ePlace" maxlength="60" autocomplete="off">
    </div>
    <div class="field">
      <label for="eCat">Category (optional)</label>
      <input type="text" id="eCat" maxlength="24" list="catList" autocomplete="off">
    </div>
    <div class="field">
      <label for="eRemind">Reminder</label>
      <select id="eRemind"></select>
    </div>
    <p class="err" id="evErr" role="alert"></p>
    <div class="row">
      <button class="btn" type="submit" id="evSave">Add event</button>
      <button class="btn ghost" type="button" id="evCancel">Cancel</button>
    </div>
    <div class="row" id="evSkipRow" hidden>
      <button class="btn ghost" type="button" id="evSkipBtn">Skip this day</button>
    </div>
    <div class="row" id="evDeleteRow" hidden>
      <button class="btn ghost" type="button" id="evDeleteBtn">Delete event</button>
      <span id="evDeleteAsk" hidden class="row">
        <span class="muted" id="evDeleteMsg"></span>
        <button class="btn danger" type="button" id="evDeleteYes">Yes, delete</button>
        <button class="btn ghost" type="button" id="evDeleteNo">Keep it</button>
      </span>
    </div>
  </form>
</dialog>

<dialog class="sheet" id="brSheet" aria-labelledby="brTitle">
  <form id="brForm" novalidate>
    <h2 id="brTitle">New break</h2>
    <div class="field">
      <label for="bLabel">Name (optional)</label>
      <input type="text" id="bLabel" maxlength="40" autocomplete="off">
    </div>
    <div class="two-col">
      <div class="field"><label for="bFrom">From</label><input type="date" id="bFrom"></div>
      <div class="field"><label for="bTo">To (included)</label><input type="date" id="bTo"></div>
    </div>
    <fieldset class="field">
      <legend>Pauses</legend>
      <div class="seg two">
        <input type="radio" name="bscope" id="bAll" value="all" checked><label for="bAll">All repeating events</label>
        <input type="radio" name="bscope" id="bSome" value="some"><label for="bSome">Only some</label>
      </div>
    </fieldset>
    <fieldset class="field" id="bPickWrap" hidden>
      <legend>Which events</legend>
      <div id="bPick"></div>

    $("brTitle").textContent = b ? "Edit break" : "New break";
    $("brSave").textContent = b ? "Save changes" : "Add break";
    $("bLabel").value = b ? b.label : "";
    var d0 = schedDay || today();
    $("bFrom").value = b ? b.from : d0;
    $("bTo").value = b ? b.to : d0;
    brPicked = b ? b.ids.slice() : [];
    document.getElementById(b && !b.all ? "bSome" : "bAll").checked = true;
    renderBrPick(); syncBrScope();
    $("brErr").textContent = "";
    $("brDeleteRow").hidden = !b; $("brDeleteAsk").hidden = true; $("brDeleteBtn").hidden = false;
    if (!brDlg.open) brDlg.showModal();
    $("bLabel").focus();
  }
  function closeBr() { if (brDlg.open) brDlg.close(); }
  Array.prototype.forEach.call(document.querySelectorAll('input[name="bscope"]'), function (r) { r.addEventListener("change", syncBrScope); });
  $("brCancel").addEventListener("click", closeBr);
  brDlg.addEventListener("click", function (e) { if (e.target === brDlg) closeBr(); });
  $("brForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var from = $("bFrom").value, to = $("bTo").value, some = document.querySelector('input[name="bscope"]:checked').value === "some", err = "";
    if (!from || !to) err = "Pick the first and last day of the break.";
    else if (to < from) err = "The last day needs to be on or after the first day.";
    else if (some && !brPicked.length) err = "Pick at least one event, or choose all repeating events.";
    if (err) { $("brErr").textContent = err; $("brErr").focus(); return; }
    var data = { label: $("bLabel").value.trim(), from: from, to: to, all: !some, ids: some ? brPicked.slice() : [] };
    if (brEditing) {
      var t = state.breaks.filter(function (x) { return x.id === brEditing; })[0];
      if (t) Object.assign(t, data);
      toast("Changes saved");
    } else {
      data.id = newId(); state.breaks.push(data);
      toast("Break added");
    }
    closeBr(); changed();
  });
  $("brDeleteBtn").addEventListener("click", function () {
    var b = state.breaks.filter(function (x) { return x.id === brEditing; })[0];
    $("brDeleteMsg").textContent = "Delete “" + (b && b.label ? b.label : "this break") + "”? Its events will run again.";
    $("brDeleteBtn").hidden = true; $("brDeleteAsk").hidden = false; $("brDeleteYes").focus();
  });
  $("brDeleteNo").addEventListener("click", function () { $("brDeleteAsk").hidden = true; $("brDeleteBtn").hidden = false; $("brDeleteBtn").focus(); });
  $("brDeleteYes").addEventListener("click", function () {
    var id = brEditing, snap = JSON.stringify(state);
    state.breaks = state.breaks.filter(function (x) { return x.id !== id; });
    closeBr(); toast("Break deleted", snap); changed();
  });

  // ---------- reminders ----------
  // Open items worth a nudge right now: one-time tasks due within 3 hours (or today, if no time is set) or overdue,
  // and daily/weekly streaks that are still open late in the period.
  function alerts() {
    if (mode === "loading" || vacOn(today())) return [];
    var now = new Date(), tk = today(), out = [];
    var sa = (state.settings.streakAt || "20:00").split(":"), streakFrom = +sa[0] * 60 + +sa[1];
    var minsNow = now.getHours() * 60 + now.getMinutes(), dow = now.getDay();
    if (state.settings.evNotify) eventsOn(tk).forEach(function (x) {
      var e = x.e;
      if (x.skipped || e.remind === null) return;
      var until = toMin(e.start) - minsNow;
      if (until > e.remind || until < -1) return;
      out.push({ id: "ev:" + e.id, level: "yellow", text: "“" + e.title + "” " + (until <= 0 ? "starts now" : "starts in " + fmtIn(until)) + (e.place ? " at " + e.place : "") + "." });
    });
    if (!state.settings.notify) return out;
    state.tasks.forEach(function (t) {
      var a = analyze(t);
      if (a.done) return;
      if (t.type === "once") {
        if (!t.due) return;
        var diff = dueMoment(t) - now;
        if (diff < 0) out.push({ id: "od:" + t.id, level: "red", text: "“" + t.title + "” is overdue." });
        else if (t.dueTime && diff <= 3 * 36e5) out.push({ id: "soon:" + t.id, level: "red", text: "“" + t.title + "” is due " + (diff < 36e5 ? "in " + Math.max(1, Math.round(diff / 6e4)) + " min" : "at " + t.dueTime) + "." });
        else if (!t.dueTime && t.due === tk) out.push({ id: "soon:" + t.id, level: "yellow", text: "“" + t.title + "” is due today." });
        return;
      }
      if (!(a.streak > 0)) return;
      var fz = state.freezes[t.type] > 0 ? " You have a freeze in stock if you need it." : "";
      if (t.type === "daily" && minsNow >= streakFrom) {
        out.push({ id: "st:" + t.id, level: "yellow", text: "Your " + a.streak + "-day streak on “" + t.title + "” is still open today. A quick check-in keeps it going." + fz });
      } else if (t.type === "weekly" && (dow === 0 || dow === 6)) {
        var more = t.target > 1 ? " " + (t.target - a.count) + " more to go." : "";
        out.push({ id: "st:" + t.id, level: "yellow", text: "Your " + a.streak + "-week streak on “" + t.title + "” ends Sunday night." + more + fz });
      }
    });
    return out;
  }

  var notified = {}, lastSig = "";
  try { var nz = JSON.parse(localStorage.getItem("tt-notified") || "{}"); if (nz && nz.day === today()) notified = nz.keys || {}; } catch (e) {}
  function rememberNotified() { try { localStorage.setItem("tt-notified", JSON.stringify({ day: today(), keys: notified })); } catch (e) {} }

  function beep() {
    try {
      var C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      var ctx = new C(), t0 = ctx.currentTime;
      [0, .3, .6].forEach(function (d) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "square"; o.frequency.value = 880;
        g.gain.setValueAtTime(.0001, t0 + d); g.gain.exponentialRampToValueAtTime(.35, t0 + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + d + .24);
        o.connect(g); g.connect(ctx.destination); o.start(t0 + d); o.stop(t0 + d + .26);
      });
      setTimeout(function () { try { ctx.close(); } catch (e) {} }, 1500);
    } catch (e) {}
  }
  var alertBox = null, alertTexts = [];
  function loudAlert(texts) {
    if (DESK) { try { DESK.alert({ texts: texts, primary: state.settings.primary, secondary: state.settings.secondary }); return; } catch (e) {} }
    beep();
    if (!alertBox) { alertBox = document.createElement("dialog"); alertBox.className = "alertbox"; alertBox.setAttribute("aria-labelledby", "abTitle"); document.body.appendChild(alertBox); }
    alertTexts = alertBox.open ? alertTexts.concat(texts) : texts.slice();
    alertBox.innerHTML = "";
    var h = el("h2", "", "Heads up"); h.id = "abTitle"; alertBox.appendChild(h);
    var ul = document.createElement("ul"); alertTexts.forEach(function (x) { ul.appendChild(el("li", "", x)); }); alertBox.appendChild(ul);
    var ok = el("button", "btn", "Got it"); ok.type = "button"; ok.addEventListener("click", function () { alertBox.close(); });
    alertBox.appendChild(ok);
    if (!alertBox.open) { try { alertBox.showModal(); } catch (e) {} }
    ok.focus();
  }

  // System notification. Android only allows them through the service worker, so use it when there is one.
  function sysNotify(text) {
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    var opts = { body: text, requireInteraction: !!state.settings.loud, icon: "icons/icon-192.png", badge: "icons/badge-96.png", tag: "tt-" + text.length + "-" + text.slice(0, 24) };
    try {
      if (WEB && navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then(function (r) { return r.showNotification("Task Tracker", opts); }).catch(function () {});
        return;
      }
      delete opts.icon; delete opts.badge;
      new Notification("Task Tracker", opts);
    } catch (e) {}
  }

  function notifyTick() {
    var list = alerts(), sig = list.map(function (x) { return x.id + x.text; }).join("|");
    var fresh = list.filter(function (x) { return !notified[x.id + "@" + today()]; });
    if (fresh.length) {
      fresh.forEach(function (x) {
        notified[x.id + "@" + today()] = 1;
        if (!(DESK && state.settings.loud)) sysNotify(x.text);
      });
      rememberNotified();
      if (state.settings.loud) loudAlert(fresh.map(function (x) { return x.text; }));
      else toast(fresh.length === 1 ? fresh[0].text : fresh.length + " things need a look. Check the Heads up card.");
    }
    if (sig !== lastSig) {
      lastSig = sig;
      if (view === "tasks" && !dlg.open && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) render();
    }
  }

  // ---------- startup ----------
  function startLocal() { mode = "local"; render(); }
  // Installable app: everything is kept in this browser's localStorage under one key.
  function startWeb() {
    var raw = null;
    try { raw = localStorage.getItem(WEB_KEY); } catch (e) { startLocal(); return; }
    if (raw) {
      var parsed = null;
      try { parsed = JSON.parse(raw); } catch (e) {}
      if (!parsed) { mode = "local"; render(); toast("Couldn't read the saved data, so nothing will be overwritten. Load a backup in Settings."); return; }
      state = normalize(parsed);
    }
    lastSaved = JSON.stringify(state);
    ref = { set: function (o) { return new Promise(function (ok) { localStorage.setItem(WEB_KEY, JSON.stringify(o)); ok(); }); } };
    mode = "synced";
    applyColors();
    var s0 = settleAll();
    if (s0.msgs.length) toast(s0.msgs.join(" "));
    render();
    if (s0.dirty || !raw) save();
    // Another window of the app saved: take its data.
    window.addEventListener("storage", function (e) {
      if (e.key !== WEB_KEY || !e.newValue || e.newValue === lastSaved) return;
      try { state = normalize(JSON.parse(e.newValue)); lastSaved = JSON.stringify(state); applyColors(); render(); } catch (x) {}
    });
    // Ask the browser not to clear the app's storage when space runs low (matters most on phones).
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    if (!state.settings.name && !state.settings.asked) askName();
    if (/[?&]action=add\b/.test(location.search)) { try { history.replaceState(null, "", location.pathname); } catch (e) {} view = "tasks"; render(); openSheet(null); }
  }

  // ---------- installable app (PWA) ----------
  var installEvt = null;
  function standalone() { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch (e) { return false; } }
  if (WEB && /^https?:$/.test(location.protocol)) {
    if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
    window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); installEvt = e; if (view === "settings") render(); });
    window.addEventListener("appinstalled", function () { installEvt = null; toast("Task Tracker is installed. Find it in your Start menu or app list."); if (view === "settings") render(); });
  }
  function installCard() {
    var c = el("section", "card");
    c.appendChild(el("h2", "", standalone() ? "Installed app" : "Install the app"));
    if (standalone()) {
      c.appendChild(el("p", "muted", /Android/i.test(navigator.userAgent)
        ? "Task Tracker is on your home screen. Reminders show while the app is open or in your recent apps."
        : "To open Task Tracker when you sign in to Windows: open Edge, type edge://apps in the address bar, open the menu on Task Tracker and turn on Start app when you sign in."));
      return c;
    }
    c.appendChild(el("p", "muted", /Android/i.test(navigator.userAgent)
      ? "Put Task Tracker on your home screen. It opens full screen like any other app and works offline."
      : "Get Task Tracker in its own window, with an icon in your Start menu and taskbar. Nothing to download and no Windows warnings."));
    if (installEvt) {
      var b = el("button", "btn", "Install Task Tracker"); b.type = "button"; b.id = "installBtn";
      b.addEventListener("click", function () {
        var e = installEvt; installEvt = null;
        try { e.prompt(); e.userChoice.then(function () { render(); }, function () { render(); }); } catch (x) { render(); }
      });
      var r = el("div", "row"); r.appendChild(b); c.appendChild(r);
    } else {
      c.appendChild(el("p", "muted", /Android/i.test(navigator.userAgent)
        ? "In Chrome, open the ⋮ menu and tap Install app (or Add to home screen)."
        : "In Edge or Chrome, click the install icon at the right end of the address bar, or open the ⋯ menu and choose Apps, then Install this site as an app."));
    }
    return c;
  }
  async function startDesktop() {
    try {
      try { deskInfo = (await DESK.info()) || deskInfo; } catch (e) {}
      var raw = await DESK.load();
      if (raw) {
        var parsed = null;
        try { parsed = JSON.parse(raw); } catch (e) {}
        if (!parsed) { mode = "local"; render(); toast("Couldn't read the saved data, so nothing will be overwritten. Check the backups folder."); return; }
        state = normalize(parsed);
      }
      lastSaved = JSON.stringify(state);
      ref = { set: function (o) { return DESK.save(JSON.stringify(o)); } };
      mode = "synced";
      applyColors();
      var s0 = settleAll();
      if (s0.msgs.length) toast(s0.msgs.join(" "));
      render();
      pushPrefs();
      if (s0.dirty || !raw) save();
      if (!state.settings.name && !state.settings.asked) askName();
    } catch (e) { startLocal(); }
  }
  async function startSynced() {
    if (DESK) { startDesktop(); return; }
    var c = window.claude;
    if (!c || !c.use) { startWeb(); return; }
    try {
      var db = await c.use("db");
      var user = await c.use("user");
      var me = user ? await user.me() : null;
      var uid = me ? me.id : null;
      if (me && me.name) { profileName = me.name; tickClock(); }
      if (!db || !uid) { startLocal(); return; }
      ref = db.doc("data/users/" + uid + "/app");
      var snap = await ref.get();
      if (snap.exists) { state = normalize(snap.data()); lastSaved = JSON.stringify(state); applyColors(); }
      mode = "synced";
      var s0 = settleAll();
      if (s0.msgs.length) toast(s0.msgs.join(" "));
      render();
      if (s0.dirty) save();
      ref.onSnapshot(function (s) {
        if (s.metadata.hasPendingWrites || saving || queued || !s.exists) return;
        var inc = normalize(s.data()), str = JSON.stringify(inc);
        if (str !== lastSaved) {
          state = inc; lastSaved = str; applyColors();
          var s1 = settleAll();
          render();
          if (s1.dirty) save();
        }
      }, function () {});
    } catch (e) { startLocal(); }
  }


  var shownDay = today();
  var lastMin = -1;
  function rollover() {
    tickClock();
    if (mode !== "loading") notifyTick();
    var mn = new Date().getMinutes();
    if (mn !== lastMin) {
      lastMin = mn;
      if (view === "schedule" && mode !== "loading" && !evDlg.open && !brDlg.open && !dlg.open && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render();
    }
    if (today() === shownDay) return;
    shownDay = today();
    if (mode === "loading") return;
    var s = settleAll();
    if (s.msgs.length) toast(s.msgs.join(" "));
    render();
    if (s.dirty) save();
  }
  setInterval(rollover, 15000);
  setTimeout(function () { if (mode !== "loading") notifyTick(); }, 2500);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) rollover(); });

  if (DESK && DESK.winClose) {
    $("wbMin").addEventListener("click", function () { DESK.winMinimize(); });
    $("wbMax").addEventListener("click", function () { DESK.winMaximize(); });
    $("wbClose").addEventListener("click", function () { DESK.winClose(); });
  }

  applyColors();
  render();
  startSynced();
})();
</script>
